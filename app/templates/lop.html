<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lớp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-graduation-cap logo-icon"></i>
                <h2>EduManage Pro</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item">
                    <i class="fa-solid fa-users"></i> Quản lý Sinh viên
                </a>
                <a href="/giangvien" class="nav-item">
                    <i class="fa-solid fa-chalkboard-user"></i> Quản lý Giảng viên
                </a>
                <a href="/khoa_bomon" class="nav-item">
                    <i class="fa-solid fa-building"></i> Khoa & Bộ môn
                </a>
                <a href="/chuyennganh" class="nav-item">
                    <i class="fa-solid fa-book-open"></i> Chuyên ngành
                </a>
                <a href="/nienkhoa" class="nav-item">
                    <i class="fa-solid fa-calendar"></i> Niên khóa
                </a>
                <a href="/lop" class="nav-item active">
                    <i class="fa-solid fa-layer-group"></i> Lớp
                </a>
            </nav>
            <div class="sidebar-footer">
                <button id="logoutBtn" class="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i> Đăng xuất</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-header">
                <div class="header-title">
                    <h1><i class="fa-solid fa-layer-group"></i> Quản Lý Lớp</h1>
                    <p class="subtitle">Quản trị danh mục Lớp thuộc trường</p>
                </div>
            </header>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div class="search-box" style="flex: 1; margin-right: 15px;">
                    <i class="fa-solid fa-search"></i>
                    <input type="text" id="lopSearchInput" placeholder="Tìm tên hoặc mã lớp...">
                </div>
                <button class="btn-primary" id="openLopModalBtn"><i class="fa-solid fa-plus"></i> Thêm Lớp</button>
            </div>

            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ML</th>
                            <th>Tên Lớp</th>
                            <th>Chuyên Ngành</th>
                            <th>Niên Khóa</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody id="lopTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal for Lop -->
    <div class="modal-overlay" id="lopModal">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="lopModalTitle">Thêm Lớp Mới</h2>
                <button class="modal-close" id="lopModalCloseBtn">&times;</button>
            </div>
            <form id="lopForm">
                <div class="modal-body">
                    <input type="hidden" id="lopId" value="">

                    <div class="form-group">
                        <label for="lopCode"><i class="fa-solid fa-barcode"></i> Mã lớp (ML) *</label>
                        <input type="text" class="form-control" id="lopCode" required placeholder="Ví dụ: LOP01">
                    </div>

                    <div class="form-group">
                        <label for="lopName"><i class="fa-solid fa-book-open"></i> Tên lớp *</label>
                        <input type="text" class="form-control" id="lopName" required placeholder="Ví dụ: Công nghệ thông tin 01">
                    </div>

                    <div class="form-group">
                        <label for="lopMajorId"><i class="fa-solid fa-book"></i> Chuyên ngành *</label>
                        <select class="form-control" id="lopMajorId" required>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="lopCohortId"><i class="fa-solid fa-calendar"></i> Niên khóa *</label>
                        <select class="form-control" id="lopCohortId" required>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-secondary" id="lopModalCancelBtn">Hủy</button>
                    <button type="submit" class="btn-primary"><i class="fa-solid fa-save"></i> Lưu thông tin</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/static/js/lop.js"></script>
</body>
</html>
