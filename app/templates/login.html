<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập | Hệ Thống Quản Lý Sinh Viên</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .login-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .login-header .brand-icon {
            margin: 0 auto 16px;
        }
        .login-header h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
        }
        .login-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="toast-container" id="toastContainer"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="brand-icon">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <h1>Hệ Thống Quản Lý Sinh Viên</h1>
                <p>Vui lòng đăng nhập để tiếp tục</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username"><i class="fa-solid fa-user"></i> Tài khoản / Mã số</label>
                    <input type="text" class="form-control" id="username" required placeholder="Nhập tài khoản" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Mật khẩu</label>
                    <input type="password" class="form-control" id="password" required placeholder="Nhập mật khẩu" autocomplete="current-password">
                </div>

                <button type="submit" class="btn-primary" id="loginBtn" style="width: 100%; justify-content: center; margin-top: 10px;">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập
                </button>
            </form>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang đăng nhập...';

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (res.ok) {
                    showToast('Đăng nhập thành công!', 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    showToast(data.error || 'Tài khoản hoặc mật khẩu không chính xác', 'error');
                }
            } catch (err) {
                showToast('Lỗi kết nối đến máy chủ', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Đăng Nhập';
            }
        });
    </script>
</body>
</html>
